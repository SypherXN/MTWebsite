name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # Lets you run deploy from Actions → Deploy to GitHub Pages → Run workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Custom domain serves at the root — not under /MTWebsite/
          ASTRO_SITE: https://matthewgtran.com
          ASTRO_BASE: /
          # Plausible is paid; leave disabled unless you add a subscription.
          PUBLIC_PLAUSIBLE_ENABLED: false
          PUBLIC_PLAUSIBLE_DOMAIN: matthewgtran.com
          PUBLIC_GA4_ENABLED: true
          PUBLIC_GA4_MEASUREMENT_ID: G-MX7RWYEFFF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
